<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<title>三方营销日报八步流水线</title>
<desc>内网 CRM 经八步处理产出主报告与 Pro 融合版：探测窗口、补抓、解析、区间基准、聚合、出主报告，再接两步 Pro 六阶分析。合计取区间报表唯一真值，analyze 累计行为成功判据。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#635bff"/><stop offset="1" stop-color="#7c73ff"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e0e7ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
</defs>
<rect width="900" height="560" fill="#f8fafc"/>
<text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1f36">三方营销日报 · 八步流水线</text>
<text x="450" y="55" text-anchor="middle" font-size="12" fill="#64748b">当月 1 号 ~ 前一天 · 窗口自动探测，不手工指定、不补录查不到的日期</text>

<rect x="40" y="76" width="820" height="40" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
<text x="58" y="101" font-size="13" font-weight="700" fill="#9a3412">数据源</text>
<text x="120" y="101" font-size="12.5" fill="#7c2d12">内网 GD-CRM 192.168.16.138:80 · 只取「媒介类型 = 三方营销」明细行</text>
<text x="700" y="101" font-size="11.5" fill="#b45309">Playwright 登录（requests 会被 IIS 伪装 404）</text>
<line x1="450" y1="116" x2="450" y2="136" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

<text x="40" y="155" font-size="12" font-weight="700" fill="#635bff">核心六步 · 出主报告</text>
<g font-size="12.5" fill="#1a1f36">
<rect x="40" y="166" width="160" height="58" rx="10" fill="url(#g3)" stroke="#c7d2fe"/>
<text x="120" y="188" text-anchor="middle" font-weight="700" fill="#4338ca">1 fetch_window</text>
<text x="120" y="208" text-anchor="middle" font-size="11" fill="#6366f1">二分探测可查首日</text>
<text x="120" y="221" text-anchor="middle" font-size="10.5" fill="#6366f1">导出整月 range.xls</text>

<rect x="216" y="166" width="160" height="58" rx="10" fill="url(#g3)" stroke="#c7d2fe"/>
<text x="296" y="188" text-anchor="middle" font-weight="700" fill="#4338ca">2 batch_fetch</text>
<text x="296" y="208" text-anchor="middle" font-size="11" fill="#6366f1">补抓缺失单日</text>
<text x="296" y="221" text-anchor="middle" font-size="10.5" fill="#6366f1">只画曲线不参与合计</text>

<rect x="392" y="166" width="160" height="58" rx="10" fill="url(#g3)" stroke="#c7d2fe"/>
<text x="472" y="188" text-anchor="middle" font-weight="700" fill="#4338ca">3 parse_daily</text>
<text x="472" y="208" text-anchor="middle" font-size="11" fill="#6366f1">单日 xls → json</text>
<text x="472" y="221" text-anchor="middle" font-size="10.5" fill="#6366f1">残缺日隔离不残留</text>

<rect x="568" y="166" width="160" height="58" rx="10" fill="url(#g1)"/>
<text x="648" y="188" text-anchor="middle" font-weight="700" fill="#fff">4 build_range</text>
<text x="648" y="208" text-anchor="middle" font-size="11" fill="#e0e7ff">区间报表 → 基准</text>
<text x="648" y="221" text-anchor="middle" font-size="10.5" fill="#e0e7ff">合计/媒介/咨询师真值</text>

<rect x="744" y="166" width="116" height="58" rx="10" fill="url(#g1)"/>
<text x="802" y="188" text-anchor="middle" font-weight="700" fill="#fff">5 analyze</text>
<text x="802" y="208" text-anchor="middle" font-size="11" fill="#e0e7ff">sanfang.json</text>
<text x="802" y="221" text-anchor="middle" font-size="10.5" fill="#e0e7ff">下游共用</text>
</g>
<line x1="200" y1="195" x2="212" y2="195" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="376" y1="195" x2="388" y2="195" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="552" y1="195" x2="564" y2="195" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="728" y1="195" x2="740" y2="195" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="40" y="238" width="820" height="40" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="56" y="263" font-size="12.5" fill="#4338ca"><tspan font-weight="700">成功判据</tspan>　analyze 必须打印「建档 X | 来院 X | 成交 X 人 | 业绩 X 元」累计行 —— 没有 = 假成功，gen 可能拿旧 json 出「看起来成功」的 HTML，判失败、不沿用旧报告</text>

<line x1="802" y1="224" x2="802" y2="296" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="802" y1="296" x2="450" y2="296" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="450" y1="296" x2="450" y2="316" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="40" y="322" width="820" height="52" rx="10" fill="url(#g1)"/>
<text x="450" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6 gen_report_sanfang.py → 三方营销媒介分析报告.html</text>
<text x="450" y="363" text-anchor="middle" font-size="11.5" fill="#e0e7ff">主报告 · 单文件全内联 · 11 节 · 7 张图 · 同窗口同 md5 去重留档</text>

<text x="40" y="405" font-size="12" font-weight="700" fill="#0891b2">Pro 增值两步 · 纯本地后处理（不联网、不改主报告）</text>
<line x1="450" y1="374" x2="450" y2="416" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="180" y="422" width="540" height="52" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
<text x="450" y="445" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e7490">7 da_pro_analysis.py → da_pro.json　→　8 gen_da_pro_fusion.py → Pro 融合版</text>
<text x="450" y="463" text-anchor="middle" font-size="11.5" fill="#0891b2">复用主报告 echarts · 六阶分析融入主报告 · 独立文件不覆盖 · 单独留档</text>

<rect x="40" y="492" width="820" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="56" y="514" font-size="12.5" fill="#166534"><tspan font-weight="700">口径铁律</tspan>　合计一律取 CRM 区间报表，绝不叠加本地存档、不用逐日相加当合计；差异只解释不修补</text>
<text x="56" y="532" font-size="11.5" fill="#15803d">Pro 两步失败只告警，不影响主报告成功判定；查不到的日期一律不纳入、不推算、不补录</text>
</svg>
